<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14171F" />
      <stop offset="100%" stop-color="#090B0E" />
    </linearGradient>

    <!-- Rich Antique Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE59F" />
      <stop offset="35%" stop-color="#D9A934" />
      <stop offset="70%" stop-color="#B8851C" />
      <stop offset="100%" stop-color="#8C5F0F" />
    </linearGradient>

    <!-- Bright Gold Highlight -->
    <linearGradient id="highlightGold" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C69425" />
      <stop offset="50%" stop-color="#FFF2BF" />
      <stop offset="100%" stop-color="#C69425" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Obsidian Base with Rounded Chamfer -->
  <rect x="10" y="10" width="180" height="180" rx="36" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="2" />

  <!-- Outer Fine Art Picture Frame (Gold border with inner miter) -->
  <rect x="26" y="26" width="148" height="148" rx="20" fill="none" stroke="url(#goldGrad)" stroke-width="3" opacity="0.9" />
  <rect x="34" y="34" width="132" height="132" rx="14" fill="none" stroke="url(#goldGrad)" stroke-width="1" stroke-dasharray="4 4" opacity="0.4" />

  <!-- Vault Wheel Outer Ring with Locking Pins / Notches -->
  <circle cx="100" cy="100" r="54" fill="none" stroke="url(#goldGrad)" stroke-width="3" />
  <circle cx="100" cy="100" r="46" fill="#12151D" stroke="url(#highlightGold)" stroke-width="1.5" />

  <!-- 8 Heavy Bank Vault Door Spokes / Lock Bolts -->
  <g stroke="url(#goldGrad)" stroke-width="3.5" stroke-linecap="round">
    <line x1="100" y1="46" x2="100" y2="38" />
    <line x1="100" y1="154" x2="100" y2="162" />
    <line x1="46" y1="100" x2="38" y2="100" />
    <line x1="154" y1="100" x2="162" y2="100" />
    <line x1="62" y1="62" x2="56" y2="56" />
    <line x1="138" y1="138" x2="144" y2="144" />
    <line x1="62" y1="138" x2="56" y2="144" />
    <line x1="138" y1="62" x2="144" y2="56" />
  </g>

  <!-- Central Vault Combination Dial -->
  <circle cx="100" cy="100" r="34" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="2.5" />

  <!-- Dial Hash Marks (Money / Security Metaphor) -->
  <circle cx="100" cy="100" r="28" fill="none" stroke="url(#highlightGold)" stroke-width="1" stroke-dasharray="2 6" opacity="0.7" />

  <!-- Center Artwork Monogram: Interlocking Easel "A" & Vault Chevron "V" -->
  <!-- "A" Frame / Painter's Easel Apex -->
  <path d="M100 74 L84 116 L89 116 L93 105 L107 105 L111 116 L116 116 Z" fill="url(#highlightGold)" />
  <!-- Easel Canvas Crossbar -->
  <line x1="94" y1="102" x2="106" y2="102" stroke="#12151D" stroke-width="2.5" stroke-linecap="round" />

  <!-- "V" Interlocking Vault Keyhole & Shield Base -->
  <path d="M85 92 L100 128 L115 92 L109 92 L100 115 L91 92 Z" fill="url(#goldGrad)" opacity="0.95" />

  <!-- Central Golden Core Pip (Vault Tumbler Center) -->
  <circle cx="100" cy="100" r="3.5" fill="#FFF2BF" filter="url(#goldGlow)" />
</svg>
